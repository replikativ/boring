version: 2.1

# The jobs here are deliberately thin wrappers around bin/ci. Logic that lives
# only inside a YAML file cannot be run before it is pushed; bin/ci is verified
# locally and CI just calls it.
#
# Every job stores target/ci-logs as an artifact. That is not boilerplate: an
# intermittent failure in this project went permanently undiagnosed because the
# test output was piped through `tail -3`, discarding the FAIL block that names
# the test and its generative seed. A failing CI run must leave behind enough to
# diagnose it the FIRST time, because generative failures may not recur.

orbs:
  tools: replikativ/clj-tools@0

executors:
  # Needs both a JVM and node (the ClojureScript suite runs under node, not
  # karma).
  #
  # JDK 21, not the image default. `cimg/clojure:1.11-node` ships JDK 17, and
  # the ClojureScript compiler's closure-compiler is built for class file
  # version 65 (Java 21): every CLJS job died with UnsupportedClassVersionError
  # before compiling a line. The jar itself is still `--release 9` -- the build
  # JDK and the target JDK are different things, and bin/check-artifact asserts
  # the second one.
  clj-node:
    docker:
      - image: cimg/clojure:1.12-openjdk-21.0-node
    working_directory: ~/repo

  # JDK 25 for the FFM half. `src/java22` compiles at --release 22 and holds
  # SegmentSource, the MemorySegment implementation behind boring.mmap; javac
  # 21 cannot target release 22 at all, so on the executor above that source
  # set is skipped and boring.mmap simply is not built.
  #
  # That is deliberate -- a green JDK 21 run is the evidence that the codec
  # works without FFM, which is a claim this project makes -- but it left the
  # entire off-heap path untested: the mmap tests SKIP there, and the artifact
  # job only ever inspected a jar with no SegmentSource in it.
  #
  # 25 and not 22: 22, 23 and 24 are non-LTS and already end-of-life, so "JDK
  # 22+" means 25 LTS in practice, and that is what users will actually run.
  clj-node-25:
    docker:
      - image: cimg/clojure:1.12-openjdk-25.0-node
    working_directory: ~/repo

commands:
  restore-deps:
    steps:
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "deps.edn" }}
            - v1-deps-
  save-deps:
    steps:
      - save_cache:
          key: v1-deps-{{ checksum "deps.edn" }}
          paths:
            - ~/.m2
            - ~/.gitlibs
            - .cpcache
  store-logs:
    steps:
      - store_artifacts:
          path: target/ci-logs
          destination: ci-logs

jobs:
  jvm:
    executor: clj-node
    steps:
      - checkout
      - restore-deps
      - run:
          name: Lint
          command: bin/ci lint
      - run:
          name: JVM conformance, golden corpus and generative suite
          command: bin/ci jvm
      # These two were green locally and not run here at all, which is the
      # worst combination: a gate nobody is watching.
      - run:
          name: nippy stress-data coverage
          command: bin/ci nippy
      - run:
          name: hasch content-addressing
          command: bin/ci hasch
      - run:
          name: Built artifact — class-file version, legal files, POM
          command: bin/ci artifact
      - save-deps
      - store-logs

  # The reference readers in interop/ are documentation that executes. Without
  # this job a wire change would silently invalidate doc/INTEROP.md.
  # Both readers, or neither. bin/ci FAILS rather than skips the Rust reader
  # when CI is set, because a reference reader that silently does not run is
  # worse than one that is absent -- the point of two independent readers is
  # that they disagree.
  interop:
    executor: clj-node
    steps:
      - checkout
      - restore-deps
      - restore_cache:
          keys:
            - v1-rust-{{ checksum "interop/rust/Cargo.lock" }}
            - v1-rust-
      - run:
          # The image has python3 but no pip, and no Rust at all. The first
          # run here failed with `pip3: command not found`.
          name: Install python3-pip, cbor2 and Rust
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-pip
            # FLOORED at 5.5, where cbor2 renamed its pure-Python modules to
            # _decoder/_encoder/_types. Unpinned, this image resolved something
            # older and `interop-canonical` died with `cannot import name
            # _decoder`, while a 5.8.0 workstation was green.
            # test_canonical_bytes.py accepts both layouts now; the floor is
            # here so the C-extension/pure-Python PAIR this gate compares is a
            # known one rather than whatever the image happens to resolve.
            pip3 install --user --break-system-packages 'cbor2>=5.5,<6' \
              || pip3 install --user 'cbor2>=5.5,<6'
            if ! command -v cargo >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            echo 'source $HOME/.cargo/env' >> $BASH_ENV
            # Printed because a cbor2 version difference between this image and
            # a developer machine is exactly what broke tag 39 here once.
            python3 -c 'import importlib.metadata as m; print("cbor2", m.version("cbor2"))'
      - run:
          name: Reference readers in Python and Rust
          command: bin/ci interop
      - save_cache:
          key: v1-rust-{{ checksum "interop/rust/Cargo.lock" }}
          paths:
            - ~/.cargo
            - ~/.rustup
            - interop/rust/target
      - store-logs

  # The half the JDK 21 jobs cannot reach. Same suite, but here it compiles
  # src/java22 and the mmap tests RUN rather than skip -- they probe
  # SegmentSource specifically, not the preview java.lang.foreign that JDK 21
  # also ships, so on 21 they correctly decide FFM is unavailable and stand
  # down. Without this job that decision is never once exercised the other way.
  #
  # `bin/ci artifact` matters here too: it is the only place a jar containing
  # SegmentSource is ever built and checked, and `clj -T:build deploy` refuses
  # to publish one without it.
  ffm:
    executor: clj-node-25
    steps:
      - checkout
      - restore-deps
      - run:
          name: JVM suite on JDK 25 — mmap and the segment reader
          command: bin/ci jvm
      - run:
          name: Built artifact WITH the FFM class
          command: bin/ci artifact
      - store-logs

  cljs:
    executor: clj-node
    steps:
      - checkout
      - restore-deps
      - run:
          name: ClojureScript suite (advanced compilation, node)
          command: bin/ci cljs
      - store-logs

  # Fuzzing is a gate, not a nice-to-have: every round of it so far in this
  # project has found something. Split from the test jobs so a fuzz failure is
  # immediately distinguishable from a conformance regression.
  fuzz:
    executor: clj-node
    steps:
      - checkout
      - restore-deps
      - run:
          name: Mutation fuzzing, JVM
          command: bin/ci fuzz
      - run:
          name: Mutation fuzzing, ClojureScript
          command: bin/ci fuzz-cljs
      - store-logs

  # The gate that proves the index tests DEPEND on the index: it damages the
  # index in known ways and requires the suite to go red for each. Without it,
  # a test that passes whether or not the index is used still passes, and the
  # whole feature could be dead code behind a green suite.
  #
  # Its own job because it runs the index suite four times over, which is
  # minutes -- which is also why `bin/ci` deliberately leaves it out of `all`,
  # with a comment saying it "belongs in CI proper rather than in a local
  # bin/ci run". It was never added here, so it belonged nowhere and had never
  # run: not locally, not in CI.
  mutants:
    executor: clj-node
    steps:
      - checkout
      - restore-deps
      - run:
          name: Index mutation gate
          command: bin/ci mutants
      - store-logs

workflows:
  build-and-test:
    jobs:
      # The orb's own jobs -- deploy, release, format -- do NOT check out. Only
      # `tools/setup` does, and it persists the tree to the workspace that the
      # others attach. Without it here, `tools/deploy` attached an empty
      # workspace and died with "Specified aliases are undeclared: [:build]"
      # followed by "Unqualified function can't be resolved: deploy": there was
      # no deps.edn to read.
      #
      # setup_cljs stays false. It runs `npm ci`, and boring has no
      # package-lock.json -- the ClojureScript suite is cljs.main plus node with
      # no npm dependencies at all.
      - tools/setup:
          context: docker-deploy
          setup_cljs: false
      - jvm
      - ffm
      - cljs
      - interop
      - fuzz
      - mutants
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      # Release, mirroring konserve: deploy to Clojars from main only, then cut
      # the GitHub release. `clj -T:build deploy` runs bin/check-artifact first
      # and refuses to publish a jar that fails it, so the gate is on the
      # publish path and not merely on the test path.
      #
      # ORB JDK: CONFIRMED 22+, so this needs no pin. `tools/deploy` runs on
      # the ORB's executor rather than one declared here, and `clj -T:build
      # deploy` refuses a jar without SegmentSource, which a JDK older than 22
      # cannot build. That gate landed in febbd40 and was, for a while, an
      # open question here.
      #
      # It is answered: 0.1.9 and 0.1.10 are both on Clojars, both contain
      # org/replikativ/boring/ffm/SegmentSource.class, and that class file
      # reports major version 0x42 = 66 = Java 22. The orb built and published
      # it twice. Checked by downloading the released jars, not by reading
      # config -- which is why the earlier note stayed open, since it was
      # written before either release existed.
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/setup
            - jvm
            - ffm
            - cljs
            - interop
            - fuzz
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
